services:
  # 1. Backend Web Service (FastAPI + Uvicorn)
  - type: web
    name: reelfinder-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: reelfinder-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false

  # 2. Frontend Static Site (React SPA / Vite)
  - type: web
    name: reelfinder-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://reelfinder-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://reelfinder-backend.onrender.com

databases:
  # 3. Managed PostgreSQL Database
  - name: reelfinder-db
    databaseName: promofinder
    user: promofinder
    plan: free
