services:
  # 1. FastAPI Backend
  - type: web
    name: reelfinder-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: DATABASE_URL
        fromDatabase:
          name: reelfinder-db
          property: connectionString

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_API_KEY_2
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_API_KEY_2
        sync: false

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

  # 2. React + Vite Frontend
  - type: web
    name: reelfinder-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: reelfinder-backend
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      # React SPA fallback
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: reelfinder-db
    databaseName: promofinder
    user: promofinder
    plan: free
